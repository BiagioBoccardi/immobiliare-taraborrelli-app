# Admin panel on Netlify (the agency's website is a separate Netlify site and repository).
# In the Netlify site settings set VITE_API_BASE_URL to the gateway address printed by the
# Deploy workflow, e.g. https://taraborrelli-gateway-xxxxx.europe-west1.run.app
[build]
  command = "npm ci --no-audit --no-fund && npm run build --workspace @taraborrelli/admin"
  publish = "apps/admin/dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path is served by index.html, React Router does the rest.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
