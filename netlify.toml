# Admin panel on Netlify (the agency's website is a separate Netlify site and repository).
# The API calls go to the services on Render through Netlify: see
# scripts/netlify/admin-redirects.sh and docs/deploy/render.md.
[build]
  command = "npm ci --no-audit --no-fund && npm run build --workspace @taraborrelli/admin && sh scripts/netlify/admin-redirects.sh apps/admin/dist"
  publish = "apps/admin/dist"

[build.environment]
  NODE_VERSION = "22"
  # The panel wakes the sleeping services up as soon as it opens (apps/admin/src/warmUp.ts).
  VITE_WARM_UP_SERVICES = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
